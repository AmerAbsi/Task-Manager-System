<div class="modal-backdrop-custom" (click)="cancelled.emit()"></div>

<div class="modal-custom" style="max-width: 380px;">
  <div class="card border-0 shadow">
    <div class="card-body text-center p-4">

      <i class="bi bi-exclamation-triangle text-danger fs-1"></i>
      <h2 class="h6 mt-3 mb-2">{{ title() }}</h2>
      <p class="text-secondary small mb-4">{{ message() }}</p>

      <div class="d-flex gap-2 justify-content-center">
        <button class="btn btn-sm btn-outline-secondary"
                (click)="cancelled.emit()">
          Cancel
        </button>
        <button class="btn btn-sm btn-danger" (click)="confirmed.emit()">
          {{ confirmLabel() }}
        </button>
      </div>

    </div>
  </div>
</div>
