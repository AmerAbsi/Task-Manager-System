<div class="comment" [class.comment-flat]="isFlat">

  <div class="d-flex gap-2">
    @if (!isFlat) {
    <span class="comment-avatar">{{ initials(comment().authorName) }}</span>
    }
    <div class="comment-content">
      <div class="comment-body">
        <div class="d-flex align-items-baseline gap-2 mb-1 flex-wrap">
          <span class="fw-medium small">{{ comment().authorName }}</span>
          <span class="text-secondary" style="font-size: 0.75rem;">
            {{ comment().createdAt | date: 'dd MMM, HH:mm' }}
          </span>
        </div>
        <div class="small comment-text">{{ comment().content }}</div>
      </div>

      <div class="d-flex align-items-center gap-3 mt-1">
        <button class="btn btn-link btn-sm p-0 text-secondary reply-btn"
                (click)="toggleReply()">
          <i class="bi bi-reply"></i> Reply
        </button>

        @if (hasReplies) {
          <button class="btn btn-link btn-sm p-0 text-secondary reply-btn"
                  (click)="toggleCollapsed()">
            <i class="bi" [class.bi-chevron-up]="!collapsed()"
                          [class.bi-chevron-down]="collapsed()"></i>
            {{ collapsed() ? 'Show' : 'Hide' }}
            {{ comment().replies.length }}
            {{ comment().replies.length === 1 ? 'reply' : 'replies' }}
          </button>
        }
      </div>

      @if (showReplyBox()) {
        <div class="mt-2">
          <textarea class="form-control form-control-sm" rows="2"
                    placeholder="Write a reply"
                    [(ngModel)]="replyText"></textarea>
          <div class="d-flex gap-2 mt-2">
            <button class="btn btn-accent btn-sm" (click)="submitReply()">
              Reply
            </button>
            <button class="btn btn-outline-secondary btn-sm" (click)="toggleReply()">
              Cancel
            </button>
          </div>
        </div>
      }

      @if (hasReplies && !collapsed()) {
        <div [class.nested]="canNest" class="mt-3">
          @for (reply of comment().replies; track reply.id) {
            <app-comment-thread
              [comment]="reply"
              [depth]="isFlat ? depth() : depth() + 1"
              [maxDepth]="maxDepth()"
              (replyRequested)="bubbleReply($event)" />
          }
        </div>
      }
    </div>
  </div>

</div>
